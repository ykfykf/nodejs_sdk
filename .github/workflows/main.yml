# .github/workflows/main.yml
name: Release Node.js SDK

on:
  push:
    branches: [master, feat/release]
    paths-ignore: ["**.md", ".gitignore", "LICENSE"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (simulate publish without actually pushing to npm)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout 代码（含完整历史，用于 tag 操作）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      # 3. 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: "https://registry.npmjs.org"

      # 4. 获取 release_info（供 CASM 通知使用）
      - name: Extract Release Info
        id: release_info
        run: |
          if [ -f ".release_info" ]; then
            RELEASE_UUID=$(cat .release_info | jq -r '.release_uuid')
            echo "release_uuid=$RELEASE_UUID" >> $GITHUB_OUTPUT
          fi

      # 5. 安装依赖
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 6. 编译项目（先 core 后 service，turbo 根据 dependsOn 自动处理顺序）
      - name: Build
        run: pnpm build

      # 7. 运行测试
      - name: Test
        run: pnpm test:core

      # 9. 发布包（core + service）
      #    - 前置检测版本是否已存在，已存在则跳过
      #    - 发布成功后自动打 tag（格式：包名@版本）
      #    - 内置 npm 频率限制重试和包闶延迟
      - name: Publish packages
        run: |
          chmod +x scripts/publish.js
          node scripts/publish.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

      # 10. 通知 CASM
      - name: Notify CASM
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          WEBHOOK_URL: ${{ secrets.CASM_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          CONCLUSION="${{ job.status == 'success' && 'success' || 'failure' }}"
          PAYLOAD=$(jq -n \
            --arg action "nodejs" \
            --argjson run_id "${{ github.run_id }}" \
            --arg name "${{ github.workflow }}" \
            --arg conclusion "$CONCLUSION" \
            --arg branch "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg html_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg release_uuid "${{ steps.release_info.outputs.release_uuid }}" \
            --arg repo "${{ github.repository }}" \
            '{
              action: $action,
              workflow_run: {
                id: $run_id,
                name: $name,
                conclusion: $conclusion,
                head_branch: $branch,
                head_sha: $sha,
                html_url: $html_url,
                release_uuid: $release_uuid
              },
              repository: {
                full_name: $repo
              }
            }')
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-TT-ENV: boe_githubaction" \
            -d "$PAYLOAD"
